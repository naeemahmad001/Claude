name: Build Windows EXE

# Builds a standalone Windows executable on GitHub's own Windows machines
# and publishes it as a downloadable artifact. Runs automatically on every
# push to these branches, and can also be started by hand from the Actions
# tab (the "Run workflow" button, via workflow_dispatch).

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build FXE-Analyzer.exe
        run: pyinstaller --noconfirm --clean packaging/FXE-Analyzer.spec

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: FXE-Analyzer-windows
          path: dist/FXE-Analyzer.exe
          if-no-files-found: error
